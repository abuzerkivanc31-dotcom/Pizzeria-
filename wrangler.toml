# Cloudflare-Einstellungen: Website liegt im Ordner "public", die Funktionen in "src/worker.js".
name = "pizzeria"
main = "src/worker.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Speicher für Status, Preise, Eventtage und Bestellanfragen (ersetzt Netlify Blobs)
[[kv_namespaces]]
binding = "DATA"
id = "b1e5fecb198e4efca05c850caed83606"

# Alle 6 Stunden Eventtage der YAYLA Arena aktualisieren
[triggers]
crons = ["0 */6 * * *"]
