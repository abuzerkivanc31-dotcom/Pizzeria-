# Cloudflare-Einstellungen: Website liegt im Ordner "public", die Funktionen in "src/worker.js".
name = "pizzeria"
main = "src/worker.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Speicher für Status, Preise, Eventtage und Bestellanfragen (ersetzt Netlify Blobs)
[[kv_namespaces]]
binding = "DATA"
id = "b1e5fecb198e4efca05c850caed83606"

# Datenbank für Kundenkonten (Cloudflare D1, Speicherort EU)
[[d1_databases]]
binding = "DB"
database_name = "pizzeria-kunden"
database_id = "336870be-95ec-4222-a039-69ebf7171eb3"

# Alle 6 Stunden Eventtage der YAYLA Arena aktualisieren; alle 2 Minuten die Rückfrage "noch geöffnet?" bei Veranstaltungen
[triggers]
crons = ["0 */6 * * *", "*/2 * * * *"]
